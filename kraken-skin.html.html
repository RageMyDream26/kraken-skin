<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=320, initial-scale=1.0" />
  <title>NZXT Kraken Z — Top/Bottom Hardware Monitor</title>
  <style>
    /* Reset spacing and lock viewport to the 320x320 circular Kraken Z LCD */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 320px;
      height: 320px;
      overflow: hidden;
      background: #030712;
    }

    body {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      border-radius: 50%;
      position: relative;
    }

    /* Top (CPU) and Bottom (GPU) halves */
    .half {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
    }

    /* Pad top half inward so enlarged name and stats clear the circular top edge */
    .half-top {
      padding: 20px 10px 2px 10px;
    }

    /* Pad bottom half inward so enlarged name and stats clear the circular bottom edge */
    .half-bottom {
      padding: 2px 10px 20px 10px;
    }

    /* Horizontal divider line between top and bottom halves */
    .h-divider {
      width: 68%;
      height: 1px;
      align-self: center;
      flex-shrink: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(148, 163, 184, 0.35) 25%,
        rgba(148, 163, 184, 0.35) 75%,
        transparent 100%
      );
    }

    /* Hardware name label sized to fit cleanly inside the circular Kraken Z display */
    .hw-name {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.2px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
      margin-bottom: 4px;
    }

    .cpu-accent {
      color: #22c55e;
    }

    .gpu-accent {
      color: #a855f7;
    }

    /* Temperature and clock speed row inside each half */
    .stat-group {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
    }

    .temp {
      font-size: 46px;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }

    .clock-box {
      display: flex;
      align-items: baseline;
      gap: 3px;
      line-height: 1.02;
    }

    .clock {
      font-size: 32.5px;
      font-weight: 800;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      font-size: 17px;
      font-weight: 700;
      color: #94a3b8;
      margin-left: 2px;
    }

    .clock-unit {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #7dd3fc;
      text-transform: uppercase;
    }

    /* Semicircular top (CPU) and bottom (GPU) load indicator arcs */
    .load-arc-svg {
      position: absolute;
      inset: 0;
      width: 320px;
      height: 320px;
      pointer-events: none;
      z-index: 2;
    }

    .load-arc-track {
      fill: none;
      stroke: rgba(148, 163, 184, 0.16);
      stroke-width: 7;
      stroke-linecap: round;
    }

    .load-arc-fill {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 477.52;
      stroke-dashoffset: 477.52;
      transition: stroke-dashoffset 0.25s ease-out, stroke 0.25s ease-out;
    }

    .cpu-arc-fill {
      stroke: #22c55e;
    }

    .gpu-arc-fill {
      stroke: #a855f7;
    }
  </style>
</head>
<body>
  <!-- Upper & Lower Half-Circle Load Arcs (radius = 152, half-circle length = pi * 152 = 477.52px) -->
  <svg class="load-arc-svg" width="320" height="320" viewBox="0 0 320 320" aria-hidden="true">
    <!-- Top half-circle: CPU Load (180deg -> 0deg across top) -->
    <path class="load-arc-track" d="M 8 160 A 152 152 0 0 1 312 160" />
    <path
      id="cpu-load-arc"
      class="load-arc-fill cpu-arc-fill"
      d="M 8 160 A 152 152 0 0 1 312 160"
      stroke="#22c55e"
      stroke-width="7"
      stroke-linecap="round"
      fill="none"
      stroke-dasharray="477.52"
      stroke-dashoffset="477.52"
    />

    <!-- Bottom half-circle: GPU Load (180deg -> 0deg across bottom) -->
    <path class="load-arc-track" d="M 8 160 A 152 152 0 0 0 312 160" />
    <path
      id="gpu-load-arc"
      class="load-arc-fill gpu-arc-fill"
      d="M 8 160 A 152 152 0 0 0 312 160"
      stroke="#a855f7"
      stroke-width="7"
      stroke-linecap="round"
      fill="none"
      stroke-dasharray="477.52"
      stroke-dashoffset="477.52"
    />
  </svg>

  <!-- Top Section: CPU -->
  <section class="half half-top" aria-label="CPU Metrics">
    <div id="cpu-name" class="hw-name cpu-accent">CPU</div>
    <div class="stat-group">
      <div class="temp">
        <span id="cpu-temp">--</span><span class="unit">°C</span>
      </div>
      <div class="clock-box">
        <span id="cpu-clock" class="clock">----</span>
        <span class="clock-unit">MHz</span>
      </div>
    </div>
  </section>

  <!-- Horizontal Divider Between Top and Bottom Halves -->
  <div class="h-divider" aria-hidden="true"></div>

  <!-- Bottom Section: GPU -->
  <section class="half half-bottom" aria-label="GPU Metrics">
    <div id="gpu-name" class="hw-name gpu-accent">GPU</div>
    <div class="stat-group">
      <div class="temp">
        <span id="gpu-temp">--</span><span class="unit">°C</span>
      </div>
      <div class="clock-box">
        <span id="gpu-clock" class="clock">----</span>
        <span class="clock-unit">MHz</span>
      </div>
    </div>
  </section>

  <script>
    const CPU_BASE_RGB = { r: 34, g: 197, b: 94 };
    const GPU_BASE_RGB = { r: 129, g: 140, b: 248 };
    const ARC_RADIUS = 152;
    const HALF_CIRCUMFERENCE = Math.PI * ARC_RADIUS;

    let hasLiveTelemetry = false;
    let demoStartTime = null;
    let lastPreviewFrameTime = 0;

    function toFiniteMetricNumber(raw) {
      if (typeof raw === 'number') {
        return Number.isFinite(raw) ? raw : undefined;
      }
      if (typeof raw === 'string') {
        const trimmed = raw.trim().replace('%', '');
        if (!trimmed) return undefined;
        const parsed = Number(trimmed);
        return Number.isFinite(parsed) ? parsed : undefined;
      }
      if (raw && typeof raw === 'object') {
        for (const key of ['value', 'load', 'utilization', 'usage', 'percentage', 'percent', 'current', 'temperature', 'frequency', 'clock']) {
          if (key in raw) {
            const nested = toFiniteMetricNumber(raw[key]);
            if (nested !== undefined) return nested;
          }
        }
      }
      return undefined;
    }

    function pickFirstMetric(hw, keys, fallback) {
      if (!hw || typeof hw !== 'object') return fallback;
      for (const key of keys) {
        if (key in hw) {
          const num = toFiniteMetricNumber(hw[key]);
          if (num !== undefined) return String(Math.round(num));
        }
      }
      return fallback;
    }

    function normalizeLoadPercent(val) {
      if (val > 0 && val <= 1) {
        return Math.max(0, Math.min(100, val * 100));
      }
      return Math.max(0, Math.min(100, val));
    }

    function extractLoadPercent(hw) {
      if (!hw || typeof hw !== 'object') return undefined;
      const candidates = [
        hw.load,
        hw.utilization,
        hw.usage,
        hw.totalLoad,
        hw.loadPercent,
        hw.loadPercentage,
        hw.gpuLoad,
        hw.cpuLoad
      ];
      for (const candidate of candidates) {
        const num = toFiniteMetricNumber(candidate);
        if (num !== undefined) {
          return normalizeLoadPercent(num);
        }
      }
      return undefined;
    }

    function cleanHardwareName(name, fallback, isGpu = false) {
      if (typeof name !== 'string') return fallback;
      let cleaned = name
        .replace(/\(R\)|\(TM\)|Processor|Graphics/gi, '')
        .replace(/\s+/g, ' ')
        .trim();

      if (isGpu) {
        cleaned = cleaned
          .replace(/\b(AMD|Radeon|NVIDIA|GeForce|Intel|Arc)\b/gi, '')
          .replace(/\s+/g, ' ')
          .trim();
      }

      return cleaned || fallback;
    }

    function rgbToHex({ r, g, b }) {
      const toHex = (n) => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    function getLoadPurpleColor(baseRgb, loadPct) {
      const clamped = Math.max(0, Math.min(100, Number(loadPct) || 0));
      const purpleRgb = { r: 168, g: 85, b: 247 };
      const t = clamped / 100;
      return rgbToHex({
        r: baseRgb.r + (purpleRgb.r - baseRgb.r) * t,
        g: baseRgb.g + (purpleRgb.g - baseRgb.g) * t,
        b: baseRgb.b + (purpleRgb.b - baseRgb.b) * t
      });
    }

    function updateLoadArc(arcId, loadValue, baseRgb) {
      const arcEl = document.getElementById(arcId);
      if (!arcEl) return;
      if (loadValue === undefined || loadValue === null || Number.isNaN(Number(loadValue))) {
        return;
      }
      const pct = Math.max(0, Math.min(100, Number(loadValue)));
      const dashOffset = String(HALF_CIRCUMFERENCE * (1 - pct / 100));
      const nextColor = getLoadPurpleColor(baseRgb, pct);
      arcEl.setAttribute('stroke-dasharray', String(HALF_CIRCUMFERENCE));
      arcEl.setAttribute('stroke-dashoffset', dashOffset);
      arcEl.setAttribute('stroke', nextColor);
      arcEl.style.strokeDasharray = String(HALF_CIRCUMFERENCE);
      arcEl.style.strokeDashoffset = dashOffset;
      arcEl.style.stroke = nextColor;
    }

    function animateLoadPreview(timestamp) {
      if (hasLiveTelemetry) return;
      if (demoStartTime === null) demoStartTime = timestamp;

      if (timestamp - lastPreviewFrameTime >= 80) {
        lastPreviewFrameTime = timestamp;
        const elapsedSec = (timestamp - demoStartTime) / 1000;
        const cpuPct = ((Math.sin(elapsedSec * 1.15) + 1) / 2) * 100;
        const gpuPct = ((Math.sin(elapsedSec * 1.15 - Math.PI / 2) + 1) / 2) * 100;

        updateLoadArc('cpu-load-arc', cpuPct, CPU_BASE_RGB);
        updateLoadArc('gpu-load-arc', gpuPct, GPU_BASE_RGB);
      }

      requestAnimationFrame(animateLoadPreview);
    }

    function applyFallbackPreviewTelemetry() {
      if (hasLiveTelemetry) return;
      const cpuEl = document.getElementById('cpu-name');
      const gpuEl = document.getElementById('gpu-name');
      if (cpuEl && cpuEl.textContent === 'CPU') {
        cpuEl.textContent = cleanHardwareName('Ryzen 9 7950X', 'CPU', false);
        document.getElementById('cpu-temp').textContent = '64';
        document.getElementById('cpu-clock').textContent = '5150';
      }
      if (gpuEl && gpuEl.textContent === 'GPU') {
        gpuEl.textContent = cleanHardwareName('AMD Radeon RX 7900 XTX', 'GPU', true);
        document.getElementById('gpu-temp').textContent = '58';
        document.getElementById('gpu-clock').textContent = '2640';
      }
    }

    updateLoadArc('cpu-load-arc', 50, CPU_BASE_RGB);
    updateLoadArc('gpu-load-arc', 50, GPU_BASE_RGB);
    setTimeout(applyFallbackPreviewTelemetry, 1500);
    requestAnimationFrame(animateLoadPreview);

    window.nzxt = {
      v1: {
        onMonitoringDataUpdate: (data) => {
          try {
            if (!data || typeof data !== 'object') return;
            hasLiveTelemetry = true;

            const cpus = data.cpus || data.Cpus;
            const gpus = data.gpus || data.Gpus;

            if (Array.isArray(cpus) && cpus.length > 0) {
              const cpu = cpus[0];
              const cpuLoad = extractLoadPercent(cpu);
              document.getElementById('cpu-name').textContent = cleanHardwareName(cpu.name, 'CPU', false);
              document.getElementById('cpu-temp').textContent = pickFirstMetric(
                cpu,
                ['temperature', 'temp'],
                '--'
              );
              document.getElementById('cpu-clock').textContent = pickFirstMetric(
                cpu,
                ['frequency', 'clock', 'coreClock'],
                '----'
              );
              updateLoadArc('cpu-load-arc', cpuLoad, CPU_BASE_RGB);
            }

            if (Array.isArray(gpus) && gpus.length > 0) {
              const discreteGpu =
                gpus.find((g) => g && g.name && !/intel.*(uhd|iris)|radeon\(tm\) graphics/i.test(g.name)) ||
                gpus[0];
              const gpuLoad = extractLoadPercent(discreteGpu);
              document.getElementById('gpu-name').textContent = cleanHardwareName(discreteGpu.name, 'GPU', true);
              document.getElementById('gpu-temp').textContent = pickFirstMetric(
                discreteGpu,
                ['temperature', 'temp'],
                '--'
              );
              document.getElementById('gpu-clock').textContent = pickFirstMetric(
                discreteGpu,
                ['frequency', 'clock', 'coreClock', 'graphicsClock'],
                '----'
              );
              updateLoadArc('gpu-load-arc', gpuLoad, GPU_BASE_RGB);
            }
          } catch (err) {
