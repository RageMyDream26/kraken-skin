<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=320, initial-scale=1.0" />
  <title>NZXT Kraken Z — Top/Bottom Hardware Monitor</title>
  <style>
    /* Reset spacing and lock viewport to the 320x320 circular Kraken Z LCD */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 320px;
      height: 320px;
      overflow: hidden;
      background: #030712;
    }

    body {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      border-radius: 50%;
      position: relative;
    }

    /* Top (CPU) and Bottom (GPU) halves */
    .half {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
    }

    /* Pad top half inward so enlarged name and stats clear the circular top edge */
    .half-top {
      padding: 16px 10px 2px 10px;
    }

    /* Pad bottom half inward so enlarged name and stats clear the circular bottom edge */
    .half-bottom {
      padding: 2px 10px 16px 10px;
    }

    /* Horizontal divider line between top and bottom halves */
    .h-divider {
      width: 68%;
      height: 1px;
      align-self: center;
      flex-shrink: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(148, 163, 184, 0.35) 25%,
        rgba(148, 163, 184, 0.35) 75%,
        transparent 100%
      );
    }

    /* Hardware name label reduced by 50% from 52px to 26px */
    .hw-name {
      font-size: 26px;
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      margin-bottom: 3px;
    }

    .cpu-accent {
      color: #22c55e;
    }

    .gpu-accent {
      color: #a855f7;
    }

    /* Temperature and clock speed row inside each half */
    .stat-group {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
    }

    .temp {
      font-size: 46px;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }

    .clock-box {
      display: flex;
      align-items: baseline;
      gap: 3px;
      line-height: 1.02;
    }

    .clock {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      font-size: 17px;
      font-weight: 700;
      color: #94a3b8;
      margin-left: 2px;
    }

    .clock-unit {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #7dd3fc;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <!-- Top Section: CPU -->
  <section class="half half-top" aria-label="CPU Metrics">
    <div id="cpu-name" class="hw-name cpu-accent">CPU</div>
    <div class="stat-group">
      <div class="temp">
        <span id="cpu-temp">--</span><span class="unit">°C</span>
      </div>
      <div class="clock-box">
        <span id="cpu-clock" class="clock">----</span>
        <span class="clock-unit">MHz</span>
      </div>
    </div>
  </section>

  <!-- Horizontal Divider Between Top and Bottom Halves -->
  <div class="h-divider" aria-hidden="true"></div>

  <!-- Bottom Section: GPU -->
  <section class="half half-bottom" aria-label="GPU Metrics">
    <div id="gpu-name" class="hw-name gpu-accent">GPU</div>
    <div class="stat-group">
      <div class="temp">
        <span id="gpu-temp">--</span><span class="unit">°C</span>
      </div>
      <div class="clock-box">
        <span id="gpu-clock" class="clock">----</span>
        <span class="clock-unit">MHz</span>
      </div>
    </div>
  </section>

  <script>
    /**
     * Shortens verbose hardware strings so model names fit cleanly inside each half.
     * @param {string} name - Raw hardware name from NZXT CAM.
     * @param {string} fallback - Fallback label if name is empty.
     * @returns {string}
     */
    function cleanHardwareName(name, fallback) {
      try {
        if (!name || typeof name !== 'string') return fallback;
        const cleaned = name
          .replace(/\(R\)|\(TM\)|Processor|CPU|NVIDIA|GeForce|AMD|Radeon|Intel\(R\)|Core\(TM\)|\d+-Core/gi, '')
          .replace(/\s+/g, ' ')
          .trim();
        return cleaned || fallback;
      } catch (err) {
        console.error('Error formatting hardware name:', err);
        return fallback;
      }
    }

    /**
     * Safely formats numeric telemetry values from NZXT CAM monitoring callbacks.
     * @param {number|undefined|null} value
     * @param {string} placeholder
     * @returns {string}
     */
    function formatMetric(value, placeholder) {
      if (typeof value !== 'number' || Number.isNaN(value)) {
        return placeholder;
      }
      return String(Math.round(value));
    }

    // Expose NZXT CAM Web Integration v1 monitoring hook
    window.nzxt = {
      v1: {
        onMonitoringDataUpdate: (data) => {
          try {
            if (!data || typeof data !== 'object') return;

            const { cpus, gpus } = data;

            if (Array.isArray(cpus) && cpus.length > 0) {
              const cpu = cpus[0];
              document.getElementById('cpu-name').textContent = cleanHardwareName(cpu.name, 'CPU');
              document.getElementById('cpu-temp').textContent = formatMetric(cpu.temperature, '--');
              document.getElementById('cpu-clock').textContent = formatMetric(cpu.frequency, '----');
            }

            if (Array.isArray(gpus) && gpus.length > 0) {
              const discreteGpu =
                gpus.find((g) => g && g.name && !/intel.*(uhd|iris)|radeon\(tm\) graphics/i.test(g.name)) ||
                gpus[0];
              document.getElementById('gpu-name').textContent = cleanHardwareName(discreteGpu.name, 'GPU');
              document.getElementById('gpu-temp').textContent = formatMetric(discreteGpu.temperature, '--');
              document.getElementById('gpu-clock').textContent = formatMetric(discreteGpu.frequency, '----');
            }
          } catch (err) {
            console.error('Error updating NZXT Kraken monitoring data:', err);
          }
        }
      }
    };
  </script>
</body>
</html>
