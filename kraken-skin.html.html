<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=320, initial-scale=1.0" />
  <title>NZXT Kraken Z — Top/Bottom Hardware Monitor</title>
  <style>
    /* Reset spacing and lock viewport to the 320x320 circular Kraken Z LCD */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 320px;
      height: 320px;
      overflow: hidden;
      background: #030712;
    }

    body {
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      border-radius: 50%;
      position: relative;
    }

    /* Top (CPU) and Bottom (GPU) halves */
    .half {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 0;
    }

    /* Pad top half inward so enlarged name and stats clear the circular top edge */
    .half-top {
      padding: 20px 10px 2px 10px;
    }

    /* Pad bottom half inward so enlarged name and stats clear the circular bottom edge */
    .half-bottom {
      padding: 2px 10px 20px 10px;
    }

    /* Horizontal divider line between top and bottom halves */
    .h-divider {
      width: 68%;
      height: 1px;
      align-self: center;
      flex-shrink: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(148, 163, 184, 0.35) 25%,
        rgba(148, 163, 184, 0.35) 75%,
        transparent 100%
      );
    }

    /* Hardware name label sized to fit cleanly inside the circular Kraken Z display */
    .hw-name {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.2px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
      margin-bottom: 4px;
    }

    .cpu-accent {
      color: #22c55e;
    }

    .gpu-accent {
      color: #a855f7;
    }

    /* Temperature and clock speed row inside each half */
    .stat-group {
      display: flex;
      flex-direction: row;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
    }

    .temp {
      font-size: 46px;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -1px;
      font-variant-numeric: tabular-nums;
    }

    .clock-box {
      display: flex;
      align-items: baseline;
      gap: 3px;
      line-height: 1.02;
    }

    .clock {
      font-size: 26px;
      font-weight: 800;
      color: #38bdf
