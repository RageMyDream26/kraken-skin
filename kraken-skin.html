<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle at center, #111827 0%, #030712 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      overflow: hidden;
      padding: 28px;
      text-align: center;
    }
    .card {
      width: 100%;
      padding: 10px 0;
    }
    .divider {
      width: 75%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #334155, transparent);
      margin: 6px 0;
    }
    .hw-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #94a3b8;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 230px;
      margin: 0 auto 4px auto;
    }
    .cpu-accent { color: #38bdf8; }
    .gpu-accent { color: #a78bfa; }
    .metrics {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 14px;
    }
    .temp {
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
    }
    .clock {
      font-size: 18px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .unit {
      font-size: 13px;
      color: #64748b;
      margin-left: 2px;
    }
  </style>
</head>
<body>
  <!-- CPU Section -->
  <div class="card">
    <div id="cpu-name" class="hw-name cpu-accent">Detecting CPU...</div>
    <div class="metrics">
      <div class="temp"><span id="cpu-temp">--</span><span class="unit">°C</span></div>
      <div class="clock"><span id="cpu-clock">----</span><span class="unit">MHz</span></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- GPU Section -->
  <div class="card">
    <div id="gpu-name" class="hw-name gpu-accent">Detecting GPU...</div>
    <div class="metrics">
      <div class="temp"><span id="gpu-temp">--</span><span class="unit">°C</span></div>
      <div class="clock"><span id="gpu-clock">----</span><span class="unit">MHz</span></div>
    </div>
  </div>

  <script>
    // Helper to shorten long Windows hardware strings (e.g., "AMD Ryzen 7 7800X3D 8-Core Processor" -> "Ryzen 7 7800X3D")
    function cleanName(name, type) {
      if (!name) return type;
      return name
        .replace(/\(R\)|\(TM\)|Processor|CPU|NVIDIA|GeForce|AMD|Intel\(R\)|Core\(TM\)|\d+-Core/gi, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    window.nzxt = {
      v1: {
        onMonitoringDataUpdate: (data) => {
          const { cpus, gpus } = data;

          if (cpus && cpus.length > 0) {
            const cpu = cpus[0];
            document.getElementById('cpu-name').textContent = cleanName(cpu.name, 'CPU');
            document.getElementById('cpu-temp').textContent = Math.round(cpu.temperature ?? 0);
            document.getElementById('cpu-clock').textContent = Math.round(cpu.frequency ?? 0);
          }

          // Pick the primary discrete GPU (ignoring integrated graphics if present)
          if (gpus && gpus.length > 0) {
            const gpu = gpus.find(g => !/intel.*uhd|radeon\(tm\) graphics/i.test(g.name)) || gpus[0];
            document.getElementById('gpu-name').textContent = cleanName(gpu.name, 'GPU');
            document.getElementById('gpu-temp').textContent = Math.round(gpu.temperature ?? 0);
            document.getElementById('gpu-clock').textContent = Math.round(gpu.frequency ?? 0);
          }
        }
      }
    };
  </script>
</body>
</html>
